services:
  - type: web
    name: ultradoc-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: FRONTEND_URL
        sync: false # set to the deployed Vercel URL, e.g. https://ultradoc-ai.vercel.app
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false # paste your Groq (or other OpenAI-compatible provider) API key
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBEDDING_MODEL
        value: mixedbread-ai/mxbai-embed-large-v1
      - key: RERANKER_MODEL
        value: jinaai/jina-reranker-v1-turbo-en
      - key: MODEL_CACHE_DIR
        value: /app/data/models
      - key: DATA_DIR
        value: /app/data
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
    disk:
      name: ultradoc-data
      mountPath: /app/data
      sizeGB: 5
