services:
  - type: web
    name: ultradoc-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: FRONTEND_URL
        value: https://ultradoc-ai.vercel.app
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false # paste your Groq (or other OpenAI-compatible provider) API key
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: RERANKER_MODEL
        value: Xenova/ms-marco-MiniLM-L-6-v2
      - key: MODEL_CACHE_DIR
        value: /app/data/models
      - key: DATA_DIR
        value: /app/data
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
    # No persistent disk on the free plan — uploads/Chroma data live on the
    # container's ephemeral filesystem and are wiped on every restart/redeploy.
    # Bump plan back to "starter" (or higher) and re-add a disk block for
    # data that needs to survive.
